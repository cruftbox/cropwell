name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        shell: pwsh
        run: .\test.ps1

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: Cropwell
          path: artifacts/publish/Cropwell.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/publish/Cropwell.exe --title "Cropwell $env:GITHUB_REF_NAME" --generate-notes
